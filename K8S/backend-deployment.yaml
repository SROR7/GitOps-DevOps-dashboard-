apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: dashboard-namespace

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: sror/devops-db-backend:latest

        ports:
        - containerPort: 3000

        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-api-secret
              key: GITHUB_TOKEN
        - name: GITHUB_USERNAME
          valueFrom:
            secretKeyRef:
              name: github-api-secret
              key: GITHUB_USERNAME