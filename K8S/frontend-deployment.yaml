apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: do-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: sror/devops-db-frontend:latest

        ports:
        - containerPort: 80