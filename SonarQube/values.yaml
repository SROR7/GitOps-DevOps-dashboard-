community:
  enabled: true

monitoringPasscode: "CHANGE_THIS_TO_A_LONG_RANDOM_VALUE"

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClass: gp3
  accessMode: ReadWriteOnce
  size: 20Gi

postgresql:
  enabled: false

resources:
  requests:
    cpu: 400m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi